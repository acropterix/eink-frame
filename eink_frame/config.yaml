name: E-Ink Frame
version: "1.3.5"
slug: eink_frame
description: Photos and kids' drawings for a battery-powered 13.3" Spectra 6 e-ink frame
url: https://www.waveshare.com/wiki/13.3inch_e-Paper_HAT+_(E)_Manual
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
panel_title: E-Ink Frame
homeassistant_api: true
ports:
  8200/tcp: 8200
ports_description:
  8200/tcp: Frame API (the ESP32 downloads pictures from here)
options:
  frame_token: ""
  interval_minutes: 60
  quiet_start: "22:00"
  quiet_end: "07:00"
  orientation: landscape
  flip: false
  saturation: 0.5
  shuffle: false
  low_battery_percent: 15
  time_zone: ""
schema:
  frame_token: password?
  interval_minutes: int(5,1440)
  quiet_start: match(^([01]\d|2[0-3]):[0-5]\d$)
  quiet_end: match(^([01]\d|2[0-3]):[0-5]\d$)
  orientation: list(landscape|portrait)
  flip: bool
  saturation: float(0,1)
  shuffle: bool
  low_battery_percent: int(0,100)
  time_zone: str?
